name: Validate and deploy site

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'features/**'

permissions:
  contents: read

jobs:
  integration:
    name: External integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Check published Sanity content and contract
        run: npm run test:integration:cms
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET || secrets.SANITY_DATASET }}

  build:
    name: Build static site
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET || secrets.SANITY_DATASET }}
          PUBLIC_SANITY_STUDIO_URL: ${{ vars.PUBLIC_SANITY_STUDIO_URL || secrets.PUBLIC_SANITY_STUDIO_URL }}
          PUBLIC_ASAAS_AFFILIATION_URL: ${{ vars.PUBLIC_ASAAS_AFFILIATION_URL || secrets.PUBLIC_ASAAS_AFFILIATION_URL }}
          PUBLIC_ASAAS_DONATION_URL: ${{ vars.PUBLIC_ASAAS_DONATION_URL || secrets.PUBLIC_ASAAS_DONATION_URL }}
          PUBLIC_PRIVACY_URL: ${{ vars.PUBLIC_PRIVACY_URL || secrets.PUBLIC_PRIVACY_URL }}
          PUBLIC_AFFILIATION_TERMS_URL: ${{ vars.PUBLIC_AFFILIATION_TERMS_URL || secrets.PUBLIC_AFFILIATION_TERMS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy Cloudflare Worker (${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }})
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/features/'))
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/
      - name: Deploy static assets to Workers
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npx wrangler@latest deploy
          else
            npx wrangler@latest deploy --name federacao-das-mulheres-preview
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
